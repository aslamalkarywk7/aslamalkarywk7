<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>80 Dashboard Designs — Global Domains | Islam El-Nashar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #0b1220; color: #e6e8f2; }
  header { max-width: 1200px; margin: 0 auto; padding: 40px 20px 10px; text-align: center; }
  header h1 { font-size: 30px; }
  header p { color: #8b90a7; margin-top: 8px; }
  header a { color: #38bdf8; }
  nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 18px; }
  nav button { border: 1px solid #2b3145; background: #141b2e; color: #e6e8f2; border-radius: 999px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  nav button.active, nav button:hover { background: #2b6bff; border-color: #2b6bff; }
  #count { text-align: center; color: #8b90a7; padding-bottom: 10px; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; max-width: 1200px; margin: 0 auto; padding: 10px 20px 60px; }
  figure { background: #141b2e; border: 1px solid #232c47; border-radius: 14px; overflow: hidden; }
  figure img { width: 100%; display: block; background: #fff; }
  figcaption { padding: 12px 14px; font-size: 14px; }
  figcaption small { color: #8b90a7; }
  figcaption a { color: #38bdf8; float: right; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>80 Dashboard Designs — Global Domains</h1>
  <p>8 domains × 10 layouts · static SVG mockups (HTML/CSS/JS gallery, images only) ·
  <a href="https://github.com/aslamalkarywk7/aslamalkarywk7/blob/main/docs/full-stack.md">full-stack proof</a></p>
</header>
<nav id="filters"></nav>
<div id="count"></div>
<main id="grid"></main>
<script>
const DOMAINS = ["Healthcare","Finance","E-commerce","Education","Logistics","Real Estate","SaaS Analytics","Hospitality"];
const LAYOUTS = ["Executive","Compact Ops","Night Shift","Minimal","Data Dense","Card Wall","Timeline","Split Command","Glass","Mono"];
const items = [];
for (let d = 0; d < 8; d++) for (let i = 0; i < 10; i++) {
  const n = d * 10 + i + 1;
  items.push({ id: "d-" + String(n).padStart(2, "0"), domain: DOMAINS[d], layout: LAYOUTS[i] });
}
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const filters = document.getElementById("filters");
let active = "All";
function render() {
  const rows = items.filter((x) => active === "All" || x.domain === active);
  count.textContent = rows.length + " / 80 designs" + (active === "All" ? "" : " — " + active);
  grid.innerHTML = rows.map((x) =>
    `<figure><img loading="lazy" src="img/${x.id}.svg" alt="${x.domain} ${x.layout} dashboard mockup">` +
    `<figcaption><strong>${x.id}</strong> · ${x.domain} · ${x.layout}<br><small>static mockup</small>` +
    `<a href="img/${x.id}.svg">open</a></figcaption></figure>`
  ).join("");
}
["All", ...DOMAINS].forEach((d) => {
  const b = document.createElement("button");
  b.textContent = d;
  if (d === "All") b.classList.add("active");
  b.onclick = () => { active = d; document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("active", x.textContent === d)); render(); };
  filters.appendChild(b);
});
render();
</script>
</body>
</html>
